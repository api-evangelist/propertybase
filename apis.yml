aid: propertybase
name: propertybase
description: >-
  Propertybase, now part of Lone Wolf Technologies, is a Salesforce-native real
  estate CRM used by more than 20,000 agents and brokerages across 60+ countries
  to manage leads, contacts, listings, transactions, marketing, and back-office
  workflows. Propertybase GO (marketed today as Lone Wolf Front Office within the
  Lone Wolf Foundation cloud) exposes a JSON REST API - the Propertybase GO API -
  for reading and writing CRM records such as leads, agents, properties, tasks,
  events, messages, and market reports, authenticated with a per-account
  X-BL-API-Key header.
